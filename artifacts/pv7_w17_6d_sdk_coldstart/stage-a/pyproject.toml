[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chelated-kernel"
version = "1.0.0"
description = "Zero-services kernel for tenant-partitioned index wrap, stratified ledgers, and stream holdback."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ChelatedAI"}]
keywords = ["chelated-kernel", "tenant-isolation", "audit-receipt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.24",
    "cryptography>=41",
]

[tool.setuptools]
packages = ["chelated_kernel"]
include-package-data = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
