# .github/workflows/brutal-honesty-gate.yml
#
# Brutal Honesty Rulebook v3.3 §6.3 + §4 merge gate (Zero-Billing Self-Hosted Spark 2 Runner).

name: Brutal Honesty Gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-body:
    name: §4 PR body validator
    runs-on: [self-hosted, linux, arm64, spark2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run validator against PR body from GITHUB_EVENT_PATH
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python3 -c 'import json, os, sys; ev = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")); sys.stdout.write(ev.get("pull_request", {}).get("body") or "")' \
            | python3 scripts/validate_pr_brutal_honesty.py --body -

  check-block-flag:
    name: §6.3 block-flag gate
    runs-on: [self-hosted, linux, arm64, spark2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run block-flag check
        env:
          PYTHONIOENCODING: utf-8
        run: |
          ALLOW_FLAG=""
          if python3 -c 'import json, os, sys; ev = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8")); labels = [l.get("name","") for l in ev.get("pull_request", {}).get("labels", [])]; sys.exit(0 if "debt-draining" in labels else 1)'; then
            ALLOW_FLAG="--allow-debt-prs"
            echo "::notice::debt-draining label present; --allow-debt-prs override active"
          fi
          python3 scripts/check_block_flag.py $ALLOW_FLAG

  smoke-gate:
    name: Rule 5 smoke gate
    runs-on: [self-hosted, linux, arm64, spark2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate cached Spark 2 Python venv & run floor smoke
        env:
          PYTHONIOENCODING: utf-8
          CUDA_VISIBLE_DEVICES: ""
        run: |
          VENV_DIR="$HOME/.cache/chelated-ci-py312"
          if [ ! -x "$VENV_DIR/bin/python" ]; then
            python3 -m venv "$VENV_DIR"
            "$VENV_DIR/bin/pip" install --upgrade pip
            "$VENV_DIR/bin/pip" install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          if [ -f requirements.txt ]; then
            "$VENV_DIR/bin/pip" install -q -r requirements.txt
          fi
          "$VENV_DIR/bin/python" scripts/smoke_pipeline.py

  schema-drift-gate:
    name: v3.3 schema drift validator
    runs-on: [self-hosted, linux, arm64, spark2]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run schema drift validator
        env:
          PYTHONIOENCODING: utf-8
        run: |
          VENV_DIR="$HOME/.cache/chelated-ci-py312"
          if [ ! -x "$VENV_DIR/bin/python" ]; then
            python3 -m venv "$VENV_DIR"
          fi
          "$VENV_DIR/bin/pip" install -q jsonschema pyyaml
          mkdir -p tmp
          "$VENV_DIR/bin/python" scripts/validate_v33_schema_drift.py --json-report tmp/v33-report.json
