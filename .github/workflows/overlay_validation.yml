name: Overlay Model-Scope Validation

on:
  workflow_dispatch:
    inputs:
      timeout-seconds:
        description: Timeout per validation command
        required: false
        default: "300"

jobs:
  overlay-model-scope-validation:
    runs-on: [self-hosted, linux, arm64, spark2]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run overlay Model-Scope validation bundle
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          VENV_DIR="$HOME/.cache/chelated-ci-py312"
          if [ ! -x "$VENV_DIR/bin/python" ]; then
            python3 -m venv "$VENV_DIR"
            "$VENV_DIR/bin/pip" install --upgrade pip
            "$VENV_DIR/bin/pip" install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          "$VENV_DIR/bin/pip" install -q -r requirements.txt
          "$VENV_DIR/bin/python" run_overlay_model_scope_validation.py \
            --output-dir experiment_runs/overlay-model-scope-validation/ci \
            --timeout-seconds "${{ inputs.timeout-seconds }}"
      - name: Upload validation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-model-scope-validation-summary
          path: experiment_runs/overlay-model-scope-validation/ci/validation_summary.json
          if-no-files-found: warn
          retention-days: 14
