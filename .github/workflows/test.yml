name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: [self-hosted, linux, arm64, spark2]
    steps:
      - uses: actions/checkout@v4
      - name: Run ruff lint in locked Spark 2 venv
        run: |
          mkdir -p "$HOME/.cache"
          VENV_DIR="$HOME/.cache/chelated-ci-uv-py312"
          flock "$HOME/.cache/chelated-ci-uv-py312.lock" bash -ec '
            PY_BIN="${HOME}/.local/bin/python3.12"
            [ -x "$PY_BIN" ] || PY_BIN="python3"
            VENV_DIR="$HOME/.cache/chelated-ci-uv-py312"
            if [ ! -x "$VENV_DIR/bin/python" ]; then
              "$PY_BIN" -m venv "$VENV_DIR"
            fi
            "$VENV_DIR/bin/pip" install -q "ruff>=0.4"
          '
          "$VENV_DIR/bin/ruff" check .

  test:
    runs-on: [self-hosted, linux, arm64, spark2]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies & run unit tests (Spark 2 ARM64 Python 3.12)
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          mkdir -p "$HOME/.cache"
          VENV_DIR="$HOME/.cache/chelated-ci-uv-py312"
          flock "$HOME/.cache/chelated-ci-uv-py312.lock" bash -ec '
            PY_BIN="${HOME}/.local/bin/python3.12"
            [ -x "$PY_BIN" ] || PY_BIN="python3"
            VENV_DIR="$HOME/.cache/chelated-ci-uv-py312"
            if [ ! -x "$VENV_DIR/bin/python" ]; then
              "$PY_BIN" -m venv "$VENV_DIR"
              "$VENV_DIR/bin/pip" install --upgrade pip
            fi
            if [ ! -f "$VENV_DIR/.cpu_torch_ok" ]; then
              "$VENV_DIR/bin/pip" install torch --index-url https://download.pytorch.org/whl/cpu
              touch "$VENV_DIR/.cpu_torch_ok"
            fi
            "$VENV_DIR/bin/pip" install -q -r requirements.txt
          '
          "$VENV_DIR/bin/python" -m unittest discover -s . -p "test_*.py" -v

  computational-storage-fundamentals:
    runs-on: [self-hosted, linux, arm64, spark2]
    steps:
      - uses: actions/checkout@v4
      - name: Run computational-storage checks
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          mkdir -p "$HOME/.cache"
          VENV_DIR="$HOME/.cache/chelated-ci-uv-py312"
          flock "$HOME/.cache/chelated-ci-uv-py312.lock" bash -ec '
            PY_BIN="${HOME}/.local/bin/python3.12"
            [ -x "$PY_BIN" ] || PY_BIN="python3"
            VENV_DIR="$HOME/.cache/chelated-ci-uv-py312"
            if [ ! -x "$VENV_DIR/bin/python" ]; then
              "$PY_BIN" -m venv "$VENV_DIR"
              "$VENV_DIR/bin/pip" install --upgrade pip
            fi
            if [ ! -f "$VENV_DIR/.cpu_torch_ok" ]; then
              "$VENV_DIR/bin/pip" install torch --index-url https://download.pytorch.org/whl/cpu
              touch "$VENV_DIR/.cpu_torch_ok"
            fi
            "$VENV_DIR/bin/pip" install -q -r requirements.txt
          '
          "$VENV_DIR/bin/python" -m unittest test_computational_storage_poc.py -v
          "$VENV_DIR/bin/python" computational_storage_poc/run_all_tests.py

  computational-storage-emulation:
    runs-on: [self-hosted, linux, arm64, spark2]
    steps:
      - uses: actions/checkout@v4
      - name: Run emulation validation
        run: |
          mkdir -p "$HOME/.cache"
          VENV_DIR="$HOME/.cache/chelated-ci-uv-py312"
          flock "$HOME/.cache/chelated-ci-uv-py312.lock" bash -ec '
            PY_BIN="${HOME}/.local/bin/python3.12"
            [ -x "$PY_BIN" ] || PY_BIN="python3"
            VENV_DIR="$HOME/.cache/chelated-ci-uv-py312"
            if [ ! -x "$VENV_DIR/bin/python" ]; then
              "$PY_BIN" -m venv "$VENV_DIR"
            fi
            "$VENV_DIR/bin/pip" install -q numpy
          '
          "$VENV_DIR/bin/python" -m unittest test_computational_storage_emulation.py -v
          "$VENV_DIR/bin/python" computational_storage_poc/emulation/validate_emulation_path.py
