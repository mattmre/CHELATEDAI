name: Default Promotion Evidence

on:
  workflow_dispatch:
    inputs:
      timeout-seconds:
        description: "Timeout per validation command"
        required: false
        default: "300"
      cleanup-guard-mode:
        description: "Cleanup review guard behavior"
        required: false
        default: "fail"
        type: choice
        options:
          - fail
          - warn

jobs:
  evidence-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .[dev]

      - name: Run default-promotion evidence chain
        run: |
          python run_default_promotion_evidence_chain.py \
            --output-dir experiment_runs/default-promotion-evidence-chain/ci \
            --timeout-seconds "${{ inputs.timeout-seconds }}"

      - name: Generate evidence index
        run: |
          python generate_evidence_index.py \
            --root experiment_runs \
            --output experiment_runs/evidence-index/ci/evidence_index.json

      - name: Audit evidence index freshness
        run: |
          python audit_evidence_index_freshness.py \
            --index experiment_runs/evidence-index/ci/evidence_index.json \
            --output experiment_runs/evidence-index/ci/freshness_audit.json

      - name: Plan evidence artifact cleanup
        id: cleanup-plan
        continue-on-error: true
        run: |
          cleanup_guard_args=()
          if [ "${{ inputs.cleanup-guard-mode }}" = "fail" ]; then
            cleanup_guard_args+=(--fail-on-blocked-review)
          fi
          python plan_evidence_artifact_cleanup.py \
            --root experiment_runs \
            --keep-latest 1 \
            --evidence-index experiment_runs/evidence-index/ci/evidence_index.json \
            --freshness-audit experiment_runs/evidence-index/ci/freshness_audit.json \
            --output experiment_runs/evidence-cleanup/ci/cleanup_plan.json \
            "${cleanup_guard_args[@]}"

      - name: Upload evidence-chain artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: default-promotion-evidence-chain
          path: |
            experiment_runs/default-promotion-evidence-chain/ci/
            experiment_runs/evidence-index/ci/
            experiment_runs/evidence-cleanup/ci/

      - name: Report cleanup review warning summary
        if: always() && inputs.cleanup-guard-mode == 'warn'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan_path = Path("experiment_runs/evidence-cleanup/ci/cleanup_plan.json")
          lines = ["## Cleanup Review Warning Mode", ""]
          if plan_path.exists():
              plan = json.loads(plan_path.read_text(encoding="utf-8"))
              summary = plan.get("summary", {})
              source_status = plan.get("source_status", {})
              allowed = bool(summary.get("cleanup_review_allowed", False))
              missing = summary.get("missing_source_artifacts", [])
              lines.extend(
                  [
                      f"- Cleanup review: {'allowed' if allowed else 'blocked'}",
                      f"- Plan: `{plan_path.as_posix()}`",
                      f"- Missing source artifacts: {', '.join(missing) if missing else '-'}",
                      f"- Candidate count: {summary.get('candidate_count', '-')}",
                      f"- Retained count: {summary.get('retained_count', '-')}",
                  ]
              )
              for name, status in sorted(source_status.items()):
                  present = status.get("present", False) if isinstance(status, dict) else False
                  path = status.get("path", "-") if isinstance(status, dict) else "-"
                  lines.append(f"- Source {name}: {'present' if present else 'missing'} `{path}`")
              if not allowed:
                  lines.append("- Warning: blocked cleanup candidates must not be used for deletion decisions.")
          else:
              lines.append(f"- Cleanup plan missing: `{plan_path.as_posix()}`")

          text = "\n".join(lines)
          print(text)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write(text + "\n")
          PY

      - name: Fail on blocked cleanup review
        if: steps.cleanup-plan.outcome == 'failure' && inputs.cleanup-guard-mode == 'fail'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan_path = Path("experiment_runs/evidence-cleanup/ci/cleanup_plan.json")
          lines = ["## Cleanup Review Blocked", ""]
          if plan_path.exists():
              plan = json.loads(plan_path.read_text(encoding="utf-8"))
              summary = plan.get("summary", {})
              source_status = plan.get("source_status", {})
              missing = summary.get("missing_source_artifacts", [])
              lines.extend(
                  [
                      f"- Plan: `{plan_path.as_posix()}`",
                      f"- Missing source artifacts: {', '.join(missing) if missing else '-'}",
                      f"- Candidate count: {summary.get('candidate_count', '-')}",
                      f"- Retained count: {summary.get('retained_count', '-')}",
                      f"- Candidate bytes: {summary.get('candidate_bytes', '-')}",
                  ]
              )
              for name, status in sorted(source_status.items()):
                  present = status.get("present", False) if isinstance(status, dict) else False
                  path = status.get("path", "-") if isinstance(status, dict) else "-"
                  lines.append(f"- Source {name}: {'present' if present else 'missing'} `{path}`")
          else:
              lines.append(f"- Cleanup plan missing: `{plan_path.as_posix()}`")

          text = "\n".join(lines)
          print(text)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write(text + "\n")
          PY
          echo "Cleanup review is blocked; uploaded available evidence artifacts for debugging."
          exit 1
