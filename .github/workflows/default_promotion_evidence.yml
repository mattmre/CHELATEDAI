name: Default Promotion Evidence

on:
  workflow_dispatch:
    inputs:
      timeout-seconds:
        description: "Timeout per validation command"
        required: false
        default: "300"
      cleanup-guard-mode:
        description: "Cleanup review guard behavior"
        required: false
        default: "fail"
        type: choice
        options:
          - fail
          - warn

jobs:
  evidence-chain:
    runs-on: [self-hosted, linux, arm64, spark2]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies & run evidence chain
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          VENV_DIR="$HOME/.cache/chelated-ci-py312"
          if [ ! -x "$VENV_DIR/bin/python" ]; then
            python3 -m venv "$VENV_DIR"
            "$VENV_DIR/bin/pip" install --upgrade pip
            "$VENV_DIR/bin/pip" install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          "$VENV_DIR/bin/pip" install -q -e .[dev]
          "$VENV_DIR/bin/python" run_default_promotion_evidence_chain.py \
            --output-dir experiment_runs/default-promotion-evidence-chain/ci \
            --timeout-seconds "${{ inputs.timeout-seconds }}"
          "$VENV_DIR/bin/python" generate_evidence_index.py \
            --root experiment_runs \
            --output experiment_runs/evidence-index/ci/evidence_index.json
          "$VENV_DIR/bin/python" audit_evidence_index_freshness.py \
            --index experiment_runs/evidence-index/ci/evidence_index.json \
            --output experiment_runs/evidence-index/ci/freshness_audit.json

      - name: Upload evidence-chain artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: default-promotion-evidence-chain
          path: |
            experiment_runs/default-promotion-evidence-chain/ci/
            experiment_runs/evidence-index/ci/
